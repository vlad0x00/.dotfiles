[Service]
# Type=dbus would kill the bar: waybar briefly drops the StatusNotifierWatcher
# name when it reloads (SIGUSR2), and systemd reads that as the service exiting.
# ExecStartPost keeps what Type=dbus was for — the unit stays "activating" until
# the watcher name exists, so protonvpn.service (After=) starts after the tray.
Type=exec
ExecStartPost=-/usr/bin/gdbus wait --session --timeout 10 org.kde.StatusNotifierWatcher
Restart=always
RestartSec=1
